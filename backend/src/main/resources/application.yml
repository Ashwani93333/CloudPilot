server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: cloudpilot-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudpilot}
    username: ${DB_USER:cloudpilot_user}
    password: ${DB_PASSWORD:cloudpilot_secure_password_dev123!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: ${IMPORT_BATCH_SIZE:2000}
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:50}MB
      max-request-size: ${MAX_UPLOAD_MB:50}MB

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

# CloudPilot Domain Configuration
cloudpilot:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ingestion:
    batch-size: ${IMPORT_BATCH_SIZE:2000}
    max-file-mb: ${MAX_UPLOAD_MB:50}
  aws:
    adapter-mode: ${AWS_ADAPTER_MODE:mock}
    region: ${AWS_REGION:us-east-1}

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
